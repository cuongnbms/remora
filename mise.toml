[tools]
node = "24"
pnpm = "11.18.0" # keep in sync with "packageManager" in package.json
rust = "1.95.0"

[tasks.install]
description = "Install frontend dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the app"
depends = ["install"]
run = "pnpm tauri dev"

[tasks.test]
description = "Frontend and Rust unit tests"
depends = ["install"]
run = ["pnpm test", "cargo test --manifest-path src-tauri/Cargo.toml"]

[tasks."test:remote"]
description = "Integration tests against a real host: REMORA_TEST_HOST=<ssh alias> mise run test:remote"
run = "cargo test --manifest-path src-tauri/Cargo.toml --test remote -- --test-threads=1"

[tasks.build]
description = "Produce Remora.app"
depends = ["install"]
run = "pnpm tauri build"

[tasks."install:app"]
description = "Build Remora.app and replace the copy in /Applications"
depends = ["install"]
run = """
set -euo pipefail
pnpm tauri build --bundles app
osascript -e 'quit app "Remora"' 2>/dev/null || true
rm -rf /Applications/Remora.app
ditto src-tauri/target/release/bundle/macos/Remora.app /Applications/Remora.app
open /Applications/Remora.app
"""
